project:
  name: smart_hybrid_bookshelf
  seed: 42
data:
  n_users: 2000
  n_items: 500
  n_ratings: 50000
  min_user_ratings: 5
  archive_dir: archive
  canonical_dir: data/raw
  features_dir: data/processed
  min_book_ratings: 10
evaluation:
  k_values:
  - 5
  - 10
  - 20
hybrid:
  cold_threshold: 50
  k_rrf: 60
  weights:
    cold_start:
      popularity: 0.6
      content: 0.4
    active:
      content: 0.35
      itemknn: 0.25
      popularity: 0.15
      two_tower: 0.25
  candidates_per_model: 50
models:
  popularity:
    min_ratings: 10
    score: bayesian
  item_knn:
    k_neighbors: 100
    k_predict: 20
  svd:
    n_components: 32
    n_iter: 10
  content:
    max_features: 2000
    ngram_range:
    - 1
    - 2
  two_tower:
    id_dim: 32
    embedding_dim: 32
    hidden_dims:
    - 128
    - 64
    epochs: 3
    batch_size: 1024
    lr: 0.001
    temperature: 0.07
    positives_threshold: 4
    subsample_size: 2000000
    checkpoint: data/processed/two_tower.pt
