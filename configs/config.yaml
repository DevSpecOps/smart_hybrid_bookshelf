project:
  name: smart_hybrid_bookshelf
  seed: 42

data:
  archive_dir: archive
  canonical_dir: data/raw
  features_dir: data/processed
  min_user_ratings: 3
  min_book_ratings: 5

evaluation:
  k_values: [5, 10, 20]

hybrid:
  cold_threshold: 20
  k_rrf: 60
  candidates_per_model: 50
  weights:
    cold_start:
      content: 0.85
      popularity: 0.15
    active:
      itemknn: 0.45
      content: 0.30
      two_tower: 0.20
      popularity: 0.05

models:
  popularity:
    min_ratings: 10
    score: bayesian
  item_knn:
    k_neighbors: 100
    k_predict: 20
  svd:
    n_components: 32
    n_iter: 10
  content:
    max_features: 2000
    ngram_range: [1, 2]
  two_tower:
    id_dim: 32
    embedding_dim: 32
    hidden_dims: [128, 64]
    epochs: 3
    batch_size: 512
    lr: 0.001
    temperature: 0.07
    positives_threshold: 4
    subsample_size: 1000000
    checkpoint: data/processed/two_tower.pt
